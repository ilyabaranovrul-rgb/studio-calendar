<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Календарь студии</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1c1c1e;--muted:#8e8e93;--line:#e5e5ea;--a:#7c4dff;--b:#00a67e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--card:#1c1c1e;--text:#f2f2f7;--muted:#98989f;--line:#2c2c2e;--a:#a78bfa;--b:#34d399}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:640px;margin:0 auto}
.tabs{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:8px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--a);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav button{border:0;background:var(--card);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer}
.nav .ttl{text-align:center;font-weight:600;padding:4px 12px;border-radius:10px;border:2px solid transparent}
.nav .ttl.now{border-color:#2e9e6b}
.nav small{display:block;color:var(--muted);font-weight:400;cursor:pointer}
.card{background:var(--card);border-radius:16px;overflow:hidden}
.grid{display:grid;grid-template-columns:44px 1fr 1fr}
.head{padding:10px 4px;text-align:center;font-weight:600;font-size:14px;border-bottom:1px solid var(--line)}
.col{position:relative;border-left:1px solid var(--line)}
.hr{height:44px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);padding:2px 4px}
.lines div{height:44px;border-top:1px solid var(--line)}
.lines{position:absolute;inset:0}
.ev{position:absolute;left:3px;right:3px;border-radius:8px;padding:4px 6px;font-size:12px;color:#fff;overflow:hidden}
.ev b{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:12px;color:var(--muted);margin-top:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.row{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:8px 10px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.row:first-child{border-top:0}
.row .d{font-size:13px;font-weight:600}.row .d small{display:block;color:var(--muted);font-weight:400}
.bar{position:relative;height:9px;border-radius:5px;background:var(--line);margin:3px 0}
.bar i{position:absolute;top:0;bottom:0;border-radius:5px}
.scale{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding:6px 10px 0 70px}
.mg{display:grid;grid-template-columns:repeat(7,1fr)}
.wd{text-align:center;font-size:11px;color:var(--muted);padding:8px 0}
.cell{aspect-ratio:1/1;border-top:1px solid var(--line);padding:4px;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.cell.out{opacity:.3}
.dots{display:flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%}
.free{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}
</style>
</head>
<body>
<div class="tabs" id="tabs">
  <button data-v="day">День</button><button data-v="week">Неделя</button><button data-v="month">Месяц</button>
</div>
<div class="nav">
  <button id="prev">‹</button>
  <div class="ttl" id="ttl"><span id="title"></span><small id="today">сегодня</small></div>
  <button id="next">›</button>
</div>
<div class="card" id="app"></div>
<div class="legend" id="legend"></div>
<div class="free" id="empty"></div>
<script>
var bookings=[];
var admins={};
function col(n){return admins[n]||"#8e8e93"}
var START=10,END=24,H=44,view="day";
var cur=new Date();cur.setHours(12,0,0,0);
var MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var MONN=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
var WD=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function mins(t){var p=t.split(":");return +p[0]*60+ +p[1]}
function on(day){return bookings.filter(function(b){return b.date===day})}
function monday(d){var x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function pct(t){return Math.max(0,Math.min(100,(mins(t)-START*60)/((END-START)*60)*100))}
function segs(day,room){return on(day).filter(function(b){return b.rooms.indexOf(room)>-1}).map(function(b){
  var l=pct(b.from);return '<i style="background:'+col(b.who)+';left:'+l+'%;width:'+(pct(b.to)-l)+'%"></i>'}).join("")}
var todayIso=iso(new Date());

function dayView(){
  var d=iso(cur),hrs="",ln="",ev={c1:"",c2:""},n=0;
  for(var h=START;h<END;h++){hrs+='<div class="hr">'+h+':00</div>';ln+="<div></div>"}
  on(d).forEach(function(b){b.rooms.forEach(function(r){
    var k=r==="Controll Room"?"c1":"c2",cls=k==="c1"?"c":"t";
    var top=(mins(b.from)-START*60)/60*H,hg=(mins(b.to)-mins(b.from))/60*H;
    ev[k]+='<div class="ev" style="background:'+col(b.who)+';top:'+top+'px;height:'+hg+'px"><b>'+b.who+'</b>'+b.from+'–'+b.to+(b.note?'<br>'+b.note:'')+'</div>';n++})});
  var hh=(END-START)*H;
  document.getElementById("empty").textContent=n?"":"В этот день студия свободна";
  return '<div class="grid"><div class="head"></div><div class="head">Controll Room</div><div class="head">Tone Room</div><div>'+hrs+'</div>'+
   '<div class="col" style="height:'+hh+'px"><div class="lines">'+ln+'</div>'+ev.c1+'</div>'+
   '<div class="col" style="height:'+hh+'px"><div class="lines">'+ln+'</div>'+ev.c2+'</div></div>';
}
function weekView(){
  var m=monday(cur),out='<div class="scale"><span>'+START+'</span><span>14</span><span>18</span><span>22</span></div>';
  for(var i=0;i<7;i++){
    var d=new Date(m);d.setDate(m.getDate()+i);var k=iso(d);
    out+='<div class="row'+(k===todayIso?' today':'')+'" data-d="'+k+'"><div class="d">'+WD[i]+'<small>'+d.getDate()+'</small></div><div>'+
     '<div class="bar">'+segs(k,"Controll Room")+'</div><div class="bar">'+segs(k,"Tone Room")+'</div></div></div>';
  }
  document.getElementById("empty").textContent="Нажми на день, чтобы открыть его подробно";
  return out;
}
function monthView(){
  var first=new Date(cur.getFullYear(),cur.getMonth(),1),m=monday(first),out='<div class="mg">';
  WD.forEach(function(w){out+='<div class="wd">'+w+'</div>'});
  for(var i=0;i<42;i++){
    var d=new Date(m);d.setDate(m.getDate()+i);
    if(i>=35&&d.getMonth()!==cur.getMonth())break;
    var k=iso(d),b=on(k),w=[];b.forEach(function(x){if(w.indexOf(x.who)<0)w.push(x.who)});
    out+='<div class="cell'+(d.getMonth()!==cur.getMonth()?' out':'')+(k===todayIso?' today':'')+'" data-d="'+k+'"><span>'+d.getDate()+'</span><div class="dots">'+w.map(function(n){return '<i style="background:'+col(n)+'"></i>'}).join("")+'</div></div>';
  }
  document.getElementById("empty").textContent="Нажми на день, чтобы открыть его подробно";
  return out+'</div>';
}
function title(){
  if(view==="day")return cur.getDate()+" "+MON[cur.getMonth()]+", "+["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"][cur.getDay()];
  if(view==="week"){var a=monday(cur),b=new Date(a);b.setDate(a.getDate()+6);
    return a.getDate()+" "+MON[a.getMonth()].slice(0,3)+" – "+b.getDate()+" "+MON[b.getMonth()].slice(0,3);}
  return MONN[cur.getMonth()]+" "+cur.getFullYear();
}
function render(){
  document.getElementById("ttl").className="ttl"+(view==="day"&&iso(cur)===iso(new Date())?" now":"");
  document.querySelectorAll("#tabs button").forEach(function(b){b.className=b.dataset.v===view?"on":""});
  document.getElementById("title").textContent=title();
  document.getElementById("legend").innerHTML=Object.keys(admins).map(function(n){return '<span><i class="dot" style="background:'+col(n)+'"></i>'+n+'</span>'}).join("")+(view==="week"?'<span>· верх — Controll, низ — Tone</span>':'');
  document.getElementById("app").innerHTML=view==="day"?dayView():view==="week"?weekView():monthView();
  document.querySelectorAll("[data-d]").forEach(function(e){e.onclick=function(){
    var p=e.dataset.d.split("-");cur=new Date(+p[0],+p[1]-1,+p[2],12);view="day";render()}});
}
function shift(s){
  if(view==="day")cur.setDate(cur.getDate()+s);
  else if(view==="week")cur.setDate(cur.getDate()+7*s);
  else{cur.setDate(1);cur.setMonth(cur.getMonth()+s)}
  render();
}
document.getElementById("prev").onclick=function(){shift(-1)};
document.getElementById("next").onclick=function(){shift(1)};
document.getElementById("today").onclick=function(){cur=new Date();cur.setHours(12,0,0,0);render()};
document.querySelectorAll("#tabs button").forEach(function(b){b.onclick=function(){view=b.dataset.v;render()}});

var SB="https://uocguwqpprtjuxgpensb.supabase.co",KEY="sb_publishable_di1C9QH_sey3xppSjiZQeg_DGJed82g",TZ="Europe/Kaliningrad";
function api(p){return fetch(SB+"/rest/v1/"+p,{headers:{apikey:KEY}}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
var fmt=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
function loc(s){var o={};fmt.formatToParts(new Date(s)).forEach(function(p){o[p.type]=p.value});return{d:o.year+"-"+o.month+"-"+o.day,t:o.hour+":"+o.minute}}
function load(){
  Promise.all([api("admins?select=name,color"),api("bookings?select=group_id,room,start_at,end_at,note,admins(name,color)&order=start_at")]).then(function(r){
    admins={};r[0].forEach(function(a){admins[a.name]=a.color});
    var g={};
    r[1].forEach(function(b){var s=loc(b.start_at),e=loc(b.end_at);
      if(!g[b.group_id])g[b.group_id]={date:s.d,rooms:[],from:s.t,to:e.d===s.d?e.t:"24:00",who:b.admins.name,note:b.note||""};
      g[b.group_id].rooms.push(b.room)});
    bookings=Object.keys(g).map(function(k){return g[k]});
    render();
  }).catch(function(e){document.getElementById("empty").textContent="Не удалось загрузить данные ("+e.message+")"});
}
try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}}catch(e){}
render();load();
</script>
</body>
</html>
